name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tailor
          POSTGRES_PASSWORD: tailor
          POSTGRES_DB: tailor
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tailor" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      mail:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Create test database
        run: PGPASSWORD=tailor psql -h localhost -U tailor -c 'CREATE DATABASE tailor_test'
      - run: pnpm db:deploy && pnpm db:seed
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
